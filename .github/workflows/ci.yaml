name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: XMIN, read-only and discovery tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e . pytest
      # tests/aria starts its own throwaway Postgres with initdb (ubuntu-latest ships one).
      - name: Tests
        run: PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1) pytest tests/aria -v
